[project]
name = "afridoc-intelligence-rag"
version = "2.0.0"
description = "AfriDoc Intelligence RAG: classic, agentic and private enterprise document intelligence"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2,<3", "scikit-learn>=1.3,<2", "pypdf>=4,<7", "python-multipart>=0.0.9,<1", "httpx>=0.27,<1", "pydantic>=2,<3", "python-dotenv>=1,<2", "langchain-core>=1.0,<2", "langgraph>=1.0,<2", "langchain-text-splitters>=1.0,<2"]
[project.optional-dependencies]
semantic = ["sentence-transformers>=3,<7"]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["ui.html"]
